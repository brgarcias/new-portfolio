name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The screenshots in tests/snapshots are recorded in this image. Keep its
    # tag equal to the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Playwright writes a missing screenshot and passes the test, so the job
      # compares the snapshot folder before and after the tests.
      - name: List screenshots
        run: |
          mkdir -p tests/snapshots
          find tests/snapshots -type f | sort > "$RUNNER_TEMP/snapshots-before.txt"
      - run: pnpm test:e2e
      - name: Fail on new screenshots
        run: |
          find tests/snapshots -type f | sort > "$RUNNER_TEMP/snapshots-after.txt"
          new=$(comm -13 "$RUNNER_TEMP/snapshots-before.txt" "$RUNNER_TEMP/snapshots-after.txt")
          if [ -n "$new" ]; then
            echo "$new"
            echo "::error::New screenshots were recorded. Review them in the test-results artifact and commit them to tests/snapshots."
            exit 1
          fi
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            tests/snapshots/
          retention-days: 7
